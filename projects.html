<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="اكتشف مشاريع Mr. Rabie: قناة English Learning Hub، اختبار تحديد المستوى، ومشروع My Passion للتصوير الفوتوغرافي">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>MR</text></svg>">
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #1e3a8a;
            --primary-dark: #3730a3;
            --secondary-color: #fbbf24;
            --secondary-dark: #f59e0b;
            --text-color: #333;
            --text-light: #6b7280;
            --bg-color: #f0f9ff;
            --white: #ffffff;
            --shadow-sm: 0 5px 15px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 15px 40px rgba(0, 0, 0, 0.12);
            --shadow-lg: 0 25px 60px rgba(0, 0, 0, 0.15);
        }
        
        /* Dark Mode Variables */
        [data-theme="dark"] {
            --primary-color: #3b82f6;
            --primary-dark: #1e40af;
            --text-color: #e5e7eb;
            --text-light: #9ca3af;
            --bg-color: #0f172a;
            --white: #1e2937;
            --shadow-sm: 0 5px 15px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 15px 40px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 25px 60px rgba(0, 0, 0, 0.5);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        
        body {
            background: var(--bg-color);
            min-height: 100vh;
            color: var(--text-color);
        }
        
        /* Language Switcher */
        .lang-switcher {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10000;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--white);
            padding: 8px 20px;
            border-radius: 50px;
            box-shadow: var(--shadow-md);
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid var(--secondary-color);
        }
        
        .lang-switcher:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-lg);
        }
        
        /* Theme Toggle Button */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            background: var(--white);
            border: 2px solid var(--secondary-color);
            width: 48px;
            height: 48px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: var(--primary-color);
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: var(--shadow-md);
        }
        
        .theme-toggle:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-lg);
        }
        
        .projects-hero {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: var(--white);
            padding: 120px 20px 100px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .projects-hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.15) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }
        
        .projects-hero h1 {
            font-size: 3.5rem;
            margin-bottom: 15px;
            position: relative;
            z-index: 2;
            font-weight: 900;
        }
        
        .projects-hero .subtitle {
            font-size: 1.4rem;
            color: var(--secondary-color);
            position: relative;
            z-index: 2;
            margin-bottom: 20px;
        }
        
        .projects-hero .description {
            max-width: 700px;
            margin: 0 auto;
            font-size: 1.1rem;
            line-height: 1.8;
            position: relative;
            z-index: 2;
            opacity: 0.95;
        }
        
        .projects-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 80px 20px;
        }
        
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 40px;
            margin-bottom: 80px;
        }
        
        .project-card {
            background: var(--white);
            border-radius: 30px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            transition: all 0.4s;
            position: relative;
        }
        
        .project-card:hover {
            transform: translateY(-15px);
            box-shadow: var(--shadow-lg);
        }
        
        .project-header {
            padding: 50px 40px 30px;
            position: relative;
            overflow: hidden;
        }
        
        .project-header.youtube {
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
        }
        
        .project-header.test {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        
        .project-header.photography {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }
        
        .project-icon {
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--white);
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-md);
        }
        
        .project-header h2 {
            font-size: 2rem;
            color: var(--white);
            margin-bottom: 10px;
            font-weight: 800;
        }
        
        .project-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.25);
            color: var(--white);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
        }
        
        .project-body {
            padding: 40px;
        }
        
        .project-body p {
            color: var(--text-light);
            line-height: 1.9;
            margin-bottom: 25px;
            font-size: 1.05rem;
        }
        
        .features-list {
            list-style: none;
            margin-bottom: 30px;
        }
        
        .features-list li {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #f3f4f6;
            color: #4b5563;
        }
        
        .features-list li:last-child {
            border-bottom: none;
        }
        
        .features-list li i {
            color: #10b981;
            font-size: 1.1rem;
            margin-top: 5px;
        }
        
        .project-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-item {
            background: var(--bg-light);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }
        
        .stat-item .number {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        
        .stat-item .label {
            color: #9ca3af;
            font-size: 0.9rem;
        }
        
        .project-cta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .project-btn {
            flex: 1;
            min-width: 150px;
            padding: 16px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            text-align: center;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Cairo', sans-serif;
            border: none;
            cursor: pointer;
        }
        
        .project-btn.youtube {
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
            color: var(--white);
        }
        
        .project-btn.test {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: var(--white);
        }
        
        .project-btn.photography {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: var(--white);
        }
        
        .project-btn.outline {
            background: transparent;
            border: 2px solid #e5e7eb;
            color: var(--text-light);
        }
        
        .project-btn.outline:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
        
        .collection-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            color: #92400e;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
        }
        
        .journey-section {
            background: var(--white);
            border-radius: 30px;
            padding: 60px;
            box-shadow: var(--shadow-md);
            margin-top: 80px;
        }
        
        .journey-section h2 {
            text-align: center;
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 50px;
            font-weight: 800;
        }
        
        .journey-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
        }
        
        .journey-item {
            text-align: center;
            padding: 30px 20px;
            background: var(--bg-light);
            border-radius: 20px;
            transition: all 0.3s;
        }
        
        .journey-item:hover {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            transform: translateY(-5px);
        }
        
        .journey-number {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: var(--secondary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0 auto 20px;
        }
        
        .journey-item h3 {
            color: var(--primary-color);
            font-size: 1.2rem;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .journey-item p {
            color: var(--text-light);
            font-size: 0.95rem;
            line-height: 1.6;
        }
        
        .projects-cta {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            border-radius: 30px;
            padding: 80px 40px;
            text-align: center;
            color: var(--white);
            margin-top: 80px;
            position: relative;
            overflow: hidden;
        }
        
        .projects-cta h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            position: relative;
            z-index: 2;
            font-weight: 800;
        }
        
        .projects-cta p {
            font-size: 1.2rem;
            margin-bottom: 35px;
            opacity: 0.95;
            position: relative;
            z-index: 2;
        }
        
        .cta-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            position: relative;
            z-index: 2;
        }
        
        .btn {
            padding: 16px 45px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.15rem;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn-secondary {
            background: var(--secondary-color);
            color: var(--primary-color);
            box-shadow: var(--shadow-md);
        }
        
        .btn-secondary:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: var(--shadow-lg);
        }
        
        .btn-outline {
            background: transparent;
            color: var(--white);
            border: 2px solid rgba(255, 255, 255, 0.5);
        }
        
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--white);
            transform: translateY(-5px);
        }
        
        /* Back to Top Button */
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: var(--secondary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: var(--shadow-md);
            transition: all 0.3s;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
        }
        
        .back-to-top.show {
            opacity: 1;
            visibility: visible;
        }
        
        /* Footer */
        .footer {
            text-align: center;
            margin-top: 80px;
            padding: 30px 20px;
            color: var(--text-light);
            font-size: 0.95rem;
            border-top: 1px solid #e5e7eb;
        }
        
        .footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
        
        /* Responsive */
        @media (max-width: 968px) {
            .projects-grid {
                grid-template-columns: 1fr;
            }
            
            .projects-hero h1 {
                font-size: 2.5rem;
            }
            
            .journey-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

    <div class="theme-toggle" onclick="toggleTheme()">
        <i class="fas fa-moon" id="themeIcon"></i>
