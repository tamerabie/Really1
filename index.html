<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Rabie | تامر ربيع - صانع محتوى تعليمي</title>
    <meta name="description" content="تامر ربيع - معلم لغة إنجليزية وصانع محتوى تعليمي. اكتشف قناتي التعليمية، اختبار تحديد المستوى، ومشروعي الفني My Passion">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>MR</text></svg>">
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #1e3a8a;
            --primary-dark: #3730a3;
            --secondary-color: #fbbf24;
            --secondary-dark: #f59e0b;
            --text-color: #333;
            --text-light: #6b7280;
            --bg-color: #f0f9ff;
            --bg-light: #f9fafb;
            --white: #ffffff;
            --shadow-sm: 0 5px 15px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 15px 40px rgba(0, 0, 0, 0.12);
            --shadow-lg: 0 25px 60px rgba(0, 0, 0, 0.15);
        }
        
        /* ==================== Dark Mode ==================== */
        [data-theme="dark"] {
            --primary-color: #3b82f6;
            --primary-dark: #1e40af;
            --text-color: #e5e7eb;
            --text-light: #9ca3af;
            --bg-color: #0f172a;
            --bg-light: #1e2937;
            --white: #1e2937;
            --shadow-sm: 0 5px 15px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 15px 40px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 25px 60px rgba(0, 0, 0, 0.5);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        
        body {
            background: var(--bg-color);
            color: var(--text-color);
            line-height: 1.8;
            overflow-x: hidden;
        }
        
        /* ==================== Language Switcher ==================== */
        .lang-switcher {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10000;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--white);
            padding: 8px 20px;
            border-radius: 50px;
            box-shadow: var(--shadow-md);
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid var(--secondary-color);
        }
        
        .lang-switcher:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-lg);
        }
        
        /* ==================== Theme Toggle Button ==================== */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            background: var(--white);
            border: 2px solid var(--secondary-color);
            width: 48px;
            height: 48px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: var(--primary-color);
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: var(--shadow-md);
        }
        
        .theme-toggle:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-lg);
        }
        
        /* ==================== Navigation ==================== */
        .navbar {
            background: var(--white);
            padding: 15px 0;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 9999;
        }
        
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
